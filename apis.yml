name: Amiato
description: 'Amiato was a Palo Alto, California big-data startup founded in 2011 by
  Nathan Binkert and Mehul A. Shah, originally incubated at Y Combinator in 2012 under
  the name Nou Data. Amiato built a real-time analytics pipeline around its Schema-lift
  technology, which extracted records from NoSQL data stores such as MongoDB and Couchbase,
  automatically inferred and transformed them into a relational schema, and loaded them
  continuously into Amazon Redshift so that unstructured operational data could be queried
  by conventional business-intelligence tools. The company raised roughly $2M from investors
  including Y Combinator, Andreessen Horowitz, Ignition Partners, Data Collective (DCVC)
  and angel Bobby Yazdani. Amazon Web Services quietly acquired Amiato in May 2014 (reported
  publicly in April 2015) in what was widely characterized as a talent acquisition; most
  of the team joined Amazon''s database and Redshift product groups and Amiato ceased
  independent operations. The company is defunct: the amiato.com domain no longer resolves
  and there is no surviving public API, developer portal, documentation, or SDK surface
  to enrich.'
